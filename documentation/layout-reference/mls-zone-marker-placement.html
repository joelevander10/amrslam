<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zone Marker Placement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@500&display=swap" rel="stylesheet">
<style>
  /* Drawing-only layout image, same language as corner-tag-placement.html. Canvas 1920x1080.
     The corner view is NOT to scale (dimensions are written on it); the pair detail inset is
     to scale (1 mm = 2 px). Rules: manuals/rfid-tag-table.md "Speed zones", missions/line-a.json
     high_zone, amr_line/speed_zone.py, amr_line/tape_run.py (2026-10-09). */
  :root {
    --paper: #e9edf2;
    --surface: #ffffff;
    --ink: #14171d;
    --ink-2: #3d4553;
    --ink-3: #636b7c;
    --rule: #cbd2de;
    --route: #1f3f7a; --route-dark: #152c57; --route-wash: #dde6f5;
    --slow: #e09a00;  --slow-wash: #fde9b8;  --slow-ink: #8a5e00;
    --fast: #2f8a57;  --fast-wash: #d3eedd;  --fast-ink: #1e5c39;
    --tag: #c8176b;
    --agv: #23272f;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 0 40px;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.45 "IBM Plex Sans", Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------------- toolbar (never captured) ---------------- */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 2px solid var(--ink);
  }
  .toolbar strong { margin-right: 8px; font: 700 15px "Archivo", Arial, sans-serif; }
  .seg { display: flex; border: 1.5px solid var(--ink); }
  .seg button, .toolbar .go {
    border: 0; border-left: 1px solid var(--rule);
    background: var(--surface); color: var(--ink-2);
    padding: 7px 12px; cursor: pointer;
    font: 600 11px "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: .07em; text-transform: uppercase;
  }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--agv); color: #fff; }
  .toolbar .go { border: 1.5px solid var(--route-dark); background: var(--route); color: #fff; }
  .toolbar .go:disabled { opacity: .6; cursor: progress; }
  .toolbar button:focus-visible { outline: 2px solid var(--tag); outline-offset: 2px; }
  .toolbar .status {
    margin-left: auto; color: var(--ink-3);
    font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .05em; text-transform: uppercase;
  }

  .stage-wrap { padding: 20px 16px 0; }
  .stage { position: relative; margin: 0 auto; box-shadow: 0 1px 0 var(--rule), 0 10px 30px rgba(20,30,50,.12); }

  /* ---------------- canvas 1920 x 1080 ---------------- */
  .slide {
    position: absolute; top: 0; left: 0;
    width: 1920px; height: 1080px;
    transform-origin: top left;
    overflow: hidden;
    background: var(--surface);
  }

  .dwg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .dwg text { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .head { font: 700 36px "Archivo", Arial, sans-serif !important; text-transform: uppercase; }
  .sub  { font: 700 24px "Archivo", Arial, sans-serif !important; text-transform: uppercase; letter-spacing: .04em; }
  .lbl { font-size: 26px; font-weight: 600; letter-spacing: .02em; }
  .sm  { font-size: 22px; font-weight: 600; }
  .rule { font: 500 22px "IBM Plex Sans", Arial, sans-serif !important; }
  .rule tspan.k { font-weight: 700; fill: #14171d; }
  .code { font: 700 22px "Archivo", Arial, sans-serif !important; fill: #fff; }
  .normband { fill: none; stroke: var(--slow-wash); stroke-width: 56; }
  .fastband { fill: none; stroke: var(--fast-wash); stroke-width: 56; }
  .lane { fill: none; stroke: var(--route); stroke-width: 7; stroke-linejoin: round; }
  .chev { fill: none; stroke: var(--route-dark); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .dim { stroke: var(--ink-2); stroke-width: 2.5; fill: none; }
  .ext { stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
  .tick { stroke: var(--ink); stroke-width: 4; }
  .lead { stroke: var(--tag); stroke-width: 2; fill: none; }
  .strip { fill: var(--tag); }
  .tape { fill: #2b3a55; }

  .legend {
    position: absolute; left: 60px; top: 962px; width: 1800px; height: 76px;
    display: flex; align-items: center; justify-content: space-between;
    margin: 0; padding: 0; list-style: none;
    color: var(--ink-2); font: 500 26px "IBM Plex Sans", Arial, sans-serif;
  }
  .legend li { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .legend svg { flex: none; width: 64px; height: 40px; }
</style>
</head>
<body>

<nav class="toolbar" aria-label="Export">
  <strong>Zone Marker Placement</strong>
  <div class="seg" role="group" aria-label="Resolution">
    <button type="button" data-res="2" aria-pressed="true">2× · 3840</button>
    <button type="button" data-res="3" aria-pressed="false">3× · 5760</button>
  </div>
  <div class="seg" role="group" aria-label="Background">
    <button type="button" data-bg="white" aria-pressed="true">White</button>
    <button type="button" data-bg="none" aria-pressed="false">Transparent</button>
  </div>
  <button type="button" class="go" id="download">Download PNG</button>
  <span class="status" id="status">16:9 · 1920 × 1080 base</span>
</nav>

<div class="stage-wrap">
<div class="stage" id="stage">
<section class="slide" id="slide" aria-label="MLS speed zone marker placement at a 90 degree corner of radius 1.5 m">

  <svg class="dwg" viewBox="0 0 1920 1080" role="img" aria-label="A 90 degree corner of radius 1.5 m joining straight S1 (horizontal) and straight S2 (vertical). On each straight a code 2 marker (outer) lies 0.75 to 0.85 m from the tangent point and a code 1 marker (inner) 0.95 to 1.05 m from it, with a 100 mm gap. Code 2 then code 1 enters the straight and grants HIGH; on S1 the HIGH budget ends with a 1.35 m ramp and 1.0 m of NORMAL before code 1. Inset: the pair to scale, strips 15 by 100 mm, code 2 centred 60 mm and code 1 30 mm from the track centre.">
    <defs>
      <path id="chev" d="M-9 -13 L9 0 L-9 13"/>
      <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto-start-reverse"><path d="M0,0 L16,7 L0,14 Z" fill="#3d4553"/></marker>
      <linearGradient id="ramp-h" gradientUnits="userSpaceOnUse" x1="400" y1="0" x2="700" y2="0">
        <stop offset="0" stop-color="#d3eedd"/><stop offset="1" stop-color="#fde9b8"/>
      </linearGradient>
      <linearGradient id="ramp-v" gradientUnits="userSpaceOnUse" x1="0" y1="770" x2="0" y2="927">
        <stop offset="0" stop-color="#fde9b8"/><stop offset="1" stop-color="#d3eedd"/>
      </linearGradient>
    </defs>

    <rect x="60" y="40" width="1800" height="890" fill="#f5f6f8" stroke="#2a2f3a" stroke-width="6"/>

    <!-- title -->
    <text class="head" x="96" y="98" fill="#14171d">MLS speed zone markers</text>
    <text class="sub" x="96" y="136" fill="#636b7c">90° corner · R 1.5 m · corner view not to scale</text>

    <!-- speed along the tape: HIGH | ramp down | NORMAL (pair, corner, pair) | ramp up -->
    <path class="fastband" d="M63 230 H400"/>
    <path d="M400 230 H700" fill="none" stroke="url(#ramp-h)" stroke-width="56"/>
    <path class="normband" d="M700 230 H1250 A240 240 0 0 1 1490 470 V770"/>
    <path d="M1490 770 V927" fill="none" stroke="url(#ramp-v)" stroke-width="56"/>
    <path class="lane" d="M63 230 H1250 A240 240 0 0 1 1490 470 V927"/>
    <g>
      <use href="#chev" class="chev" transform="translate(250 230)"/>
      <use href="#chev" class="chev" transform="translate(210 230) rotate(180)"/>
      <use href="#chev" class="chev" transform="translate(1490 880) rotate(90)"/>
      <use href="#chev" class="chev" transform="translate(1490 840) rotate(-90)"/>
    </g>

    <!-- zone labels -->
    <text class="lbl" x="84" y="188" fill="#1e5c39">HIGH 0.85 m/s</text>
    <text class="lbl" x="550" y="188" text-anchor="middle" fill="#3d4553">RAMP TO NORMAL</text>
    <text class="lbl" x="815" y="188" text-anchor="middle" fill="#8a5e00">NORMAL</text>
    <text class="head" x="96" y="300" fill="#14171d" style="font-size:30px">S1</text>
    <text class="lbl" x="1560" y="330" fill="#8a5e00">NORMAL 0.5 m/s</text>
    <text class="sm"  x="1560" y="362" fill="#8a5e00">pairs + corner</text>
    <text class="lbl" x="1540" y="854" fill="#3d4553">RAMP TO HIGH</text>
    <text class="sm"  x="1540" y="886" fill="#3d4553">2 s ≈ 1.35 m</text>
    <text class="sm"  x="1540" y="914" fill="#3d4553">from code 1</text>
    <text class="head" x="1420" y="915" text-anchor="end" fill="#14171d" style="font-size:30px">S2</text>

    <!-- tangent points -->
    <path class="tick" d="M1250 192 V268"/>
    <text class="lbl" x="1250" y="180" text-anchor="middle" fill="#14171d">T1</text>
    <path class="tick" d="M1452 470 H1528"/>
    <text class="lbl" x="1442" y="480" text-anchor="end" fill="#14171d">T2</text>

    <!-- radius and arc -->
    <path class="dim" d="M1250 470 L1310 246" marker-end="url(#arr)"/>
    <circle cx="1250" cy="470" r="5" fill="#3d4553"/>
    <text class="lbl" x="1300" y="380" fill="#14171d">R 1.5 m</text>
    <text class="sm"  x="1300" y="412" fill="#3d4553">90°</text>
    <text class="sm"  x="1290" y="444" fill="#3d4553">arc 2.36 m</text>

    <!-- S1 markers (exit pair when heading east), on the inside of the corner -->
    <rect class="strip" x="995" y="250" width="30" height="8"/>
    <rect class="strip" x="950" y="238" width="30" height="8"/>
    <path class="lead" d="M1010 199 V250 M965 199 V238"/>
    <circle cx="1010" cy="182" r="17" fill="#c8176b"/><text class="code" x="1010" y="190" text-anchor="middle">2</text>
    <circle cx="965" cy="182" r="17" fill="#c8176b"/><text class="code" x="965" y="190" text-anchor="middle">1</text>

    <!-- S2 markers (entry pair when heading south), on the inside of the corner -->
    <rect class="strip" x="1462" y="695" width="8" height="30"/>
    <rect class="strip" x="1474" y="740" width="8" height="30"/>
    <path class="lead" d="M1437 710 H1462 M1437 755 H1474"/>
    <circle cx="1420" cy="710" r="17" fill="#c8176b"/><text class="code" x="1420" y="718" text-anchor="middle">2</text>
    <circle cx="1420" cy="755" r="17" fill="#c8176b"/><text class="code" x="1420" y="763" text-anchor="middle">1</text>

    <!-- S1 dimension chain, below the tape -->
    <path class="dim" d="M400 270 V315 M700 270 V315 M950 270 V315 M1250 270 V375 M1025 262 V375"/>
    <path class="dim" d="M400 300 H700" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path class="dim" d="M700 300 H950" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path class="dim" d="M950 300 H1250" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path class="dim" d="M1025 360 H1250" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text class="sm" x="550" y="337" text-anchor="middle" fill="#3d4553">ramp 1.35 m · 2 s</text>
    <text class="sm" x="825" y="337" text-anchor="middle" fill="#3d4553">margin 1.0 m</text>
    <text class="sm" x="1100" y="337" text-anchor="middle" fill="#3d4553">1.05 m</text>
    <text class="sm" x="1137" y="397" text-anchor="middle" fill="#3d4553">0.75 m</text>
    <text class="sm" x="400" y="370" text-anchor="middle" fill="#1e5c39">HIGH budget ends</text>
    <text class="sm" x="400" y="398" text-anchor="middle" fill="#1e5c39">2.35 m before code 1</text>

    <!-- S2 dimension chain, outside the corner -->
    <path class="dim" d="M1528 695 H1600 M1528 770 H1720 M1528 470 H1720"/>
    <path class="dim" d="M1580 470 V695" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path class="dim" d="M1705 470 V770" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text class="sm" x="1592" y="600" fill="#3d4553">0.75 m</text>
    <text class="sm" x="1717" y="640" fill="#3d4553">1.05 m</text>

    <!-- exit backstops -->
    <text class="sub" x="1300" y="82" fill="#8a5e00">Leaving a straight still HIGH</text>
    <text class="sm" x="1300" y="116" fill="#8a5e00">code 1 → late drop 0.5 m/s², ~0.47 m</text>
    <text class="sm" x="1300" y="146" fill="#8a5e00">code 2 → urgent ~1 m/s², ~0.25 m</text>
    <text class="sm" x="1300" y="176" fill="#636b7c">(normally NORMAL 1.0 m before 1)</text>

    <!-- ===== pair detail, to scale: 1 mm = 2 px ===== -->
    <rect x="90" y="430" width="1090" height="310" fill="#fff" stroke="#cbd2de" stroke-width="2"/>
    <text class="sub" x="110" y="462" fill="#14171d">Pair detail · plan view · to scale 1 mm = 2 px</text>
    <!-- tape 30 mm, centre y 650 -->
    <rect class="tape" x="110" y="620" width="1050" height="60"/>
    <path d="M110 650 H1160" stroke="#fff" stroke-width="1.5" stroke-dasharray="10 8"/>
    <!-- code 2 (outer): 15 x 100 mm, centre 60 mm from the track centre -->
    <rect class="strip" x="360" y="515" width="200" height="30"/>
    <text class="code" x="460" y="538" text-anchor="middle">CODE 2 · outer</text>
    <!-- code 1 (inner): 15 x 100 mm, centre 30 mm from the track centre -->
    <rect class="strip" x="760" y="575" width="200" height="30"/>
    <text class="code" x="860" y="598" text-anchor="middle">CODE 1 · inner</text>
    <!-- along the tape: 100 | 100 | 100 (gap 50 -> 100 mm, operator 2026-10-18) -->
    <path class="dim" d="M360 483 V512 M560 483 V512 M760 483 V570 M960 483 V570"/>
    <path class="dim" d="M360 497 H560" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path class="dim" d="M560 497 H760" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path class="dim" d="M760 497 H960" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text class="sm" x="460" y="490" text-anchor="middle" fill="#3d4553">100</text>
    <text class="sm" x="660" y="490" text-anchor="middle" fill="#c8176b">gap 100</text>
    <text class="sm" x="860" y="490" text-anchor="middle" fill="#3d4553">100</text>
    <!-- across: centre-to-centre 30 and 60 -->
    <path class="ext" d="M760 590 H318 M360 530 H258 M110 650 H250"/>
    <path class="dim" d="M330 590 V650" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path class="dim" d="M270 530 V650" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text class="sm" x="316" y="614" text-anchor="end" fill="#3d4553">30</text>
    <text class="sm" x="262" y="598" text-anchor="end" fill="#3d4553">60</text>
    <!-- report points: FailSafe reports a code once its strip has fully passed -->
    <path class="dim" d="M560 684 V722 M960 684 V722"/>
    <path class="dim" d="M560 706 H960" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text class="sm" x="760" y="700" text-anchor="middle" fill="#3d4553">200 mm</text>
    <text class="sm" x="548" y="730" text-anchor="end" fill="#3d4553">code 2 reported (arms)</text>
    <text class="sm" x="972" y="730" fill="#1e5c39">code 1 → HIGH</text>
    <!-- orientation and material -->
    <text class="sm" x="122" y="642" fill="#ffffff">← corner</text>
    <text class="sm" x="1150" y="642" text-anchor="end" fill="#ffffff">straight →</text>
    <text class="sm" x="1162" y="530" text-anchor="end" fill="#3d4553">strip 15 × 100</text>
    <text class="sm" x="1162" y="558" text-anchor="end" fill="#3d4553">strip S up</text>
    <text class="sm" x="1162" y="600" text-anchor="end" fill="#3d4553">tape 30, N up</text>
    <text class="sm" x="1152" y="470" text-anchor="end" fill="#636b7c">mm, centre to centre</text>

    <!-- placement rules -->
    <text class="rule" x="96" y="782" fill="#3d4553"><tspan class="k">Placement</tspan>  one pair at both ends of every HIGH straight, same codes everywhere · code 2 nearer the corner</text>
    <text class="rule" x="96" y="814" fill="#3d4553"><tspan class="k">Read order</tspan>  2 → 1 entering: HIGH on · 1 → 2 leaving: never arms · a missed marker: stays NORMAL</text>
    <text class="rule" x="96" y="846" fill="#3d4553"><tspan class="k">Counts only</tspan>  running, line good, ≤ 30 mm off the tape centre · code 1 within 0.65 m of code 2</text>
    <text class="rule" x="96" y="878" fill="#3d4553"><tspan class="k">Side</tspan>  either side works (the code counts, not the side) · keep one side per site; drawn inside</text>
    <text class="rule" x="96" y="910" fill="#3d4553"><tspan class="k">Survey</tspan>  shortest_straight_m = code 1 to code 1 (straight-side edges) on the shortest HIGH straight</text>
  </svg>

  <ul class="legend">
    <li><svg viewBox="0 0 64 40"><path d="M2 20 H62" stroke="#d3eedd" stroke-width="30"/><path d="M2 20 H62" stroke="#1f3f7a" stroke-width="5"/></svg>HIGH 0.85 m/s</li>
    <li><svg viewBox="0 0 64 40"><path d="M2 20 H62" stroke="#fde9b8" stroke-width="30"/><path d="M2 20 H62" stroke="#1f3f7a" stroke-width="5"/></svg>NORMAL 0.5 m/s</li>
    <li><svg viewBox="0 0 64 40"><defs><linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="2" y1="0" x2="62" y2="0"><stop offset="0" stop-color="#d3eedd"/><stop offset="1" stop-color="#fde9b8"/></linearGradient></defs><path d="M2 20 H62" stroke="url(#lg)" stroke-width="30"/><path d="M2 20 H62" stroke="#1f3f7a" stroke-width="5"/></svg>Speed ramp</li>
    <li><svg viewBox="0 0 64 40"><rect x="10" y="14" width="44" height="12" fill="#c8176b"/></svg>MLS marker strip</li>
    <li><svg viewBox="0 0 64 40"><circle cx="32" cy="20" r="16" fill="#c8176b"/><text x="32" y="28" text-anchor="middle" font-family="Archivo, Arial" font-weight="700" font-size="22" fill="#fff">1</text></svg>Marker code</li>
    <li><svg viewBox="0 0 64 40"><path d="M32 4 V36" stroke="#14171d" stroke-width="4"/><path d="M2 20 H62" stroke="#1f3f7a" stroke-width="5"/></svg>Tangent point</li>
  </ul>
</section>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
  const FILE_NAME = 'mls-zone-marker-placement';

  /* ---- fit the 1920x1080 canvas to the window ---- */
  const stage = document.getElementById('stage');
  const slide = document.getElementById('slide');
  function fit() {
    const avail = Math.min(document.documentElement.clientWidth - 32, 1920);
    const s = avail / 1920;
    stage.style.width = 1920 * s + 'px';
    stage.style.height = 1080 * s + 'px';
    slide.style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit);
  fit();

  /* ---- export ---- */
  let res = 2, bg = 'white';
  document.querySelectorAll('[data-res]').forEach(b => b.addEventListener('click', () => {
    res = +b.dataset.res;
    document.querySelectorAll('[data-res]').forEach(x => x.setAttribute('aria-pressed', x === b));
  }));
  document.querySelectorAll('[data-bg]').forEach(b => b.addEventListener('click', () => {
    bg = b.dataset.bg;
    document.querySelectorAll('[data-bg]').forEach(x => x.setAttribute('aria-pressed', x === b));
  }));

  const status = document.getElementById('status');
  const btn = document.getElementById('download');
  btn.addEventListener('click', async () => {
    if (!window.htmlToImage) { status.textContent = 'Export library did not load — check internet connection'; return; }
    btn.disabled = true;
    status.textContent = 'Rendering…';
    try {
      await document.fonts.ready;
      const transparent = bg === 'none';
      const url = await htmlToImage.toPng(slide, {
        width: 1920, height: 1080, pixelRatio: res,
        backgroundColor: transparent ? undefined : '#ffffff',
        style: { transform: 'none', background: transparent ? 'transparent' : '#ffffff' },
      });
      const a = document.createElement('a');
      a.href = url;
      a.download = `${FILE_NAME}@${res}x${transparent ? '-transparent' : ''}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      status.textContent = `Saved ${1920 * res} × ${1080 * res} PNG`;
    } catch (e) {
      console.error(e);
      status.textContent = 'Export failed — see console';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
