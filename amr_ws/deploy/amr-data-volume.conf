# Move the vehicle's state and maps to their own filesystem (power-loss plan W8).
#
# *** Install this ONLY after /data/amr exists and is mounted. *** RequiresMountsFor
# on a mount that is not there stops the service from starting at all, which is why
# this is a separate drop-in and not part of amr.service.
#
#   sudo install -o root -g root -m 0644 -D amr-data-volume.conf \
#     /etc/systemd/system/amr.service.d/data-volume.conf
#   sudo systemctl daemon-reload && sudo systemctl restart amr.service
#
# Why a separate volume: the root filesystem carries the OS, the workspace and the
# journal, and a cut during any of their writes can leave the PC needing an fsck to
# boot. The vehicle's own data - maps, events, operations, reports - then rides on
# a small filesystem mounted data=journal, where every write is journalled in full
# before it lands. Throughput is irrelevant here (a map bundle is tens of MB, saved
# by hand), so the strictest mode is free.
#
# Undo: delete the drop-in, daemon-reload, restart. ~/.amr and ~/amr_maps are
# symlinks to the volume, so the tooling and the RUNBOOK paths keep working either way.
[Unit]
RequiresMountsFor=/data/amr

[Service]
Environment=AMR_STATE_DIR=/data/amr/state
Environment=AMR_MAPS_DIR=/data/amr/maps
