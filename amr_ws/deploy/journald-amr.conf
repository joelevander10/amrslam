# Bound the journal (power-loss plan W7).
#
#   sudo install -o root -g root -m 0644 -D journald-amr.conf \
#     /etc/systemd/journald.conf.d/amr.conf
#   sudo systemctl restart systemd-journald
#
# The journal is persistent and had no cap: it is the only record of what systemd
# and the supervisor did across boots, so it must survive - but it must not be able
# to fill the root filesystem either, because a full root is how a PC stops booting.
[Journal]
Storage=persistent
SystemMaxUse=300M
SystemMaxFileSize=50M
